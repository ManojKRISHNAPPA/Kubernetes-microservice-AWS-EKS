# ─── Prometheus ───────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

# ─── Grafana ──────────────────────────────────────────────────────────────────
grafana:
  adminPassword: "GrafanaAdmin@2026"
  persistence:
    enabled: true
    storageClassName: gp2
    size: 5Gi
  service:
    type: LoadBalancer
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki:3100
      access: proxy

# ─── Alertmanager ─────────────────────────────────────────────────────────────
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
  config:
    global:
      resolve_timeout: 5m
      # REPLACE THIS with your actual Slack webhook URL
      slack_api_url: "<YOUR_SLACK_WEBHOOK_URL>"

    route:
      group_by: ["alertname", "namespace", "pod"]
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 1h
      receiver: "slack-warning"
      routes:
        - match:
            severity: critical
          receiver: "slack-critical"
          continue: false
        - match:
            severity: warning
          receiver: "slack-warning"
          continue: false

    receivers:
      - name: "slack-critical"
        slack_configs:
          - channel: "#alerts-critical"
            send_resolved: true
            icon_emoji: ":red_circle:"
            title: '[CRITICAL] {{ .GroupLabels.alertname }}'
            text: >-
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Namespace:* {{ .Labels.namespace }}
              *Pod:* {{ .Labels.pod }}
              *Description:* {{ .Annotations.description }}
              *Started:* {{ .StartsAt | since }}
              {{ end }}

      - name: "slack-warning"
        slack_configs:
          - channel: "#alerts-warning"
            send_resolved: true
            icon_emoji: ":warning:"
            title: '[WARNING] {{ .GroupLabels.alertname }}'
            text: >-
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Namespace:* {{ .Labels.namespace }}
              *Pod:* {{ .Labels.pod }}
              *Description:* {{ .Annotations.description }}
              *Started:* {{ .StartsAt | since }}
              {{ end }}

# ─── Node Exporter ────────────────────────────────────────────────────────────
nodeExporter:
  enabled: true

# ─── kube-state-metrics ───────────────────────────────────────────────────────
kubeStateMetrics:
  enabled: true

# ─── Default Alert Rules ──────────────────────────────────────────────────────
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    configReloaders: true
    general: true
    kubeApiserver: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: false
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
